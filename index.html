<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級翰林自然線上測驗大題庫</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-seedling"></i> 5上翰林自然 線上測驗大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：翰林版 5上 自然第一次段考（完整收錄是非、選擇及題組題庫）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[240px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="all" selected>挑戰全部題庫（完整收錄）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">目前得分：0 分</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/natural-science-hanlin05/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 完整的 5上翰林自然題庫資料
        const allQuestions = [
            // 是非題
            { type: "TF", q: "進行植物的分類時，無論利用哪一種分類依據，最後的分類結果都一定會相同。", ans: false, explanation: "不一定，依據不同的分類標準（如生活環境、葉脈、開花與否），分類結果可能會不同。" },
            { type: "TF", q: "自然界的植物五花八門，各有各的樣貌和姿態。", ans: true, explanation: "植物種類繁多，形態各異以適應不同的生存環境。" },
            { type: "TF", q: "大萍和布袋蓮都是陸生植物。", ans: false, explanation: "大萍和布袋蓮是常見的水生植物。" },
            { type: "TF", q: "自己製作太陽高度角觀測器時，只要確認吸管是直立的就好，不需要檢查是否與地面垂直。", ans: false, explanation: "吸管必須與地面保持垂直，測量結果才會準確。" },
            { type: "TF", q: "水分從植物的根吸收進入植物體，經由莖輸送到葉子，最後從葉子蒸散出去。", ans: true, explanation: "這是植物體內水分運輸與蒸散作用的標準途徑（根→莖→葉）。" },
            { type: "TF", q: "太陽光射入三稜鏡後，我們可以看到像彩虹一樣的七彩色光。", ans: true, explanation: "陽光通過三稜鏡會因為折射而分散成彩虹色光。" },
            { type: "TF", q: "雨過天晴時，天上的彩虹會出現在太陽的相反方向。", ans: true, explanation: "觀察彩虹時需背向太陽（彩虹會出現在太陽的相反方向）。" },
            { type: "TF", q: "不同季節的日出時刻和日落時刻都不太相同。", ans: true, explanation: "受到地球公轉與太陽運行軌跡影響，不同季節日出日落時間與位置都不同。" },
            { type: "TF", q: "在臺灣，夏季的太陽高度角會比冬季的太陽高度角大，因此氣溫也會比較高。", ans: true, explanation: "夏季太陽高度角大，陽光較為直射，接收到的熱能較多，氣溫較高。" },
            { type: "TF", q: "一年之中，每天上午 6 時看到太陽升起的位置都相同。", ans: false, explanation: "日出的位置會隨著季節改變（例如夏天日出偏北，冬天日出偏南）。" },
            { type: "TF", q: "同一時間、地點，夏天的太陽高度角會比冬天的大。", ans: true, explanation: "夏天太陽運行軌跡較高，因此同一時間的太陽高度角比冬天大。" },
            { type: "TF", q: "適當的照射太陽光，可產生身體需要的維生素 C。", ans: false, explanation: "晒太陽可以幫助人體產生維生素 D，而非維生素 C。" },
            { type: "TF", q: "進行植物分類時，只要有共同特徵的植物就有可能被分在同一類。", ans: true, explanation: "分類是依據共同特徵來將植物分組。" },
            { type: "TF", q: "金桔的果實是在金桔花授粉成功後，由子房發育而成。", ans: true, explanation: "花朵授粉受精後，子房會發育成果實，胚珠發育成種子。" },
            { type: "TF", q: "我們晒太陽的好處之一，是可以合成人體所需的維生素 A。", ans: false, explanation: "晒太陽主要是合成維生素 D。" },
            { type: "TF", q: "太陽直射時的氣溫，會比太陽斜射時的氣溫高。", ans: true, explanation: "直射獲得的熱能較多，因此氣溫較高。" },
            { type: "TF", q: "同一種植物可能有多種的繁殖方式。", ans: true, explanation: "例如甘藷可以利用塊根、莖或種子進行繁殖。" },
            { type: "TF", q: "只要是陣雨過後，在天空中一定可以看到彎彎的彩虹出現。", ans: false, explanation: "除了雨後水滴，還需要背向太陽等條件配合，不一定隨時看得到。" },
            { type: "TF", q: "太陽能光電板可以將太陽的光轉換成電能使用，例如：太陽能路燈提供照明。", ans: true, explanation: "太陽能光電板能將光能轉換為電能。" },
            { type: "TF", q: "太陽的方位與影子的方位相反。", ans: true, explanation: "影子是由光線被遮擋形成的，因此影子的方向總是與光源（太陽）方向相反。" },
            { type: "TF", q: "大花咸豐草的果實有倒勾刺，會鉤附在人的衣物或動物身上來傳播種子。", ans: true, explanation: "這是一種藉由動物外表黏附傳播種子的方式。" },
            { type: "TF", q: "一種植物只有一種繁殖方式，例如：甘藷只能利用塊根繁殖。", ans: false, explanation: "甘藷除了塊根，也可以利用莖或種子繁殖。" },
            { type: "TF", q: "太陽是地球生命能量的來源，可以讓地球上的生物生生不息。", ans: true, explanation: "太陽光能提供了地球生物生長與光合作用所需的能量。" },
            { type: "TF", q: "進行「植物體內水分輸送」實驗時，在水中滴入紅色的水溶液，是為了可以方便觀察水在植物體內的變化。", ans: true, explanation: "有顏色的水溶液能讓人清楚看出水分在根、莖、葉中的流向。" },
            { type: "TF", q: "太陽能光電板設置在屋頂上，可以用來遮陽和發電。", ans: true, explanation: "太陽能光電板設置於屋頂除了發電外，也能隔絕部分陽光照射，達到遮陽效果。" },
            { type: "TF", q: "甘藷除了可以利用種子繁殖外，也可以利用莖或根來繁殖。", ans: true, explanation: "甘藷具備多種繁殖途徑。" },
            { type: "TF", q: "一天中，丹丹從太陽升起就開始觀測陽光下電線桿的影子變化，發現桿影會由長慢慢變短，直到太陽落下。", ans: false, explanation: "早晨影子長，隨著太陽升高影子變短，中午最短，下午過後影子又會逐漸變長。" },
            { type: "TF", q: "下午 4 時測量太陽高度角，夏天測得的太陽高度角會比冬天測得的大。", ans: true, explanation: "無論何時，夏天的太陽高度角普遍都比冬天來得大。" },
            { type: "TF", q: "一年中，同一時間的太陽高度角以 12 月 22 日（冬至）前後的最大。", ans: false, explanation: "12月22日前後（冬至）太陽高度角最小，夏至前後才最大。" },
            { type: "TF", q: "一年中，每天相同時間測量太陽高度角，從 3 月到 6 月，所測得的太陽高度角會愈來愈大。", ans: true, explanation: "從春分（3月）到夏至（6月），太陽直射位置漸漸偏北，高度角愈來愈大。" },
            { type: "TF", q: "奶奶用放大鏡來看報紙，是透過光的折射現象，讓字變得更大、更清楚。", ans: true, explanation: "放大鏡利用了光的折射原理來放大影像。" },
            { type: "TF", q: "大萍的葉片裡具有通氣組織可儲存空氣，讓大萍浮於水面。", ans: true, explanation: "水生植物如大萍具有通氣組織或膨大葉柄幫助漂浮。" },
            { type: "TF", q: "所有植物要繁殖下一代，都一定要經過開花、結果和產生種子的過程。", ans: false, explanation: "有些植物（如蕨類靠孢子，或利用營養器官如莖、葉、根）不一定要開花結果。" },
            { type: "TF", q: "當花完成授粉後，雄蕊的花粉和雌蕊胚珠結合會發育成種子，外側的子房會發育成果實。", ans: true, explanation: "這是植物有性生殖的結果發育過程。" },
            { type: "TF", q: "太陽能是不可永續的綠能資源，因此不可過度使用。", ans: false, explanation: "太陽能是永續的綠能資源，取之不盡、用之不竭。" },
            { type: "TF", q: "文娟要將植物分類，她只能透過資料蒐集來了解植物的特徵。", ans: false, explanation: "除了查資料，也可以透過實地觀察來分類。" },
            { type: "TF", q: "在上午進行製造彩虹的實驗時，要站在太陽下並面向西方噴灑水霧，才有機會製造出彩虹。", ans: false, explanation: "上午太陽在東方，要背向太陽（面向西方）噴水霧才對，但正確站位需注意背向陽光。" },
            { type: "TF", q: "一天中，文惠觀測陽光下升旗臺上旗竿的影子變化，從中午開始一直到下午放學，發現竿影會愈來愈長。", ans: true, explanation: "中午過後太陽高度逐漸下降，影子會由短變長。" },
            { type: "TF", q: "夜晚時，樂樂在漆黑的陽臺上擺放三稜鏡，三稜鏡會分散出像彩虹般的色光。", ans: false, explanation: "三稜鏡需要有光源（如太陽光或強光）通過才會分散出色光，黑暗中沒有光無法分散。" },
            { type: "TF", q: "根據「莖是否直立」的分類標準，可以將樟樹和蛇莓分在同一類。", ans: false, explanation: "樟樹莖直立，蛇莓是匍匐莖，會被分在不同類。" },
            { type: "TF", q: "林奈發明的「二名法」是給每一種植物一個拉丁文學名，這個學名是由屬名和種小名所構成的。", ans: true, explanation: "二名法由屬名（字首大寫）和種小名構成。" },
            { type: "TF", q: "光線從空氣進入平面的透明玻璃後，不會往中間聚集。", ans: true, explanation: "平行玻璃板不會像凸透鏡一樣讓光線匯聚。" },
            { type: "TF", q: "在夜市撈魚時，魚在水中的實際位置會比眼睛看起來的位置還要淺。", ans: false, explanation: "因為折射現象，眼睛看到的魚會比實際位置還要淺，實際魚的位置會更深。" },
            { type: "TF", q: "在同一地點觀測日出，會發現日出的位置不會隨著季節而改變。", ans: false, explanation: "日出的位置會隨著季節而改變（夏至偏東北，冬至偏東南）。" },
            { type: "TF", q: "植物體內的水，經由葉片以水蒸氣的形態散發到空氣中的過程，稱為散發作用（蒸散作用）。", ans: true, explanation: "植物藉由葉片氣孔蒸散水分。" },
            { type: "TF", q: "榕樹的氣生根可以儲存養分。", ans: false, explanation: "氣生根主要功能是吸收空氣中的水分或支撐植物體。" },
            { type: "TF", q: "在臺灣，太陽在天空中的運行偏向南方天空，所以需要大量日照才能生存的植物，種植時要種在偏南方的地點。", ans: true, explanation: "臺灣位於北半球，太陽軌跡偏南，因此面向南方的日照最充足。" },
            { type: "TF", q: "榕樹的氣生根如果一直生長到地面，氣生根會迅速加粗生長，演變成具有支撐植物體功能的支柱根。", ans: true, explanation: "氣生根著地後會發育為粗壯的支柱根以支撐龐大樹冠。" },
            { type: "TF", q: "噴水製造彩虹時，站在陽光處面向著陰影的地方噴水霧，其目的是為了要更清楚的看到彩虹的形成。", ans: true, explanation: "背向陽光（面向陰影處）噴水霧才能順利看到彩虹色光。" },
            { type: "TF", q: "鳳凰木的氣生根可以固定植物的身體。", ans: false, explanation: "鳳凰木是發展出「板根」而非氣生根來協助支撐。" },
            { type: "TF", q: "利用「開不開花」為分類標準時，可以將蛇莓和蓮分在不同類。", ans: false, explanation: "蛇莓和蓮都會開花，會被分在同一類。" },
            { type: "TF", q: "太陽能集熱器是利用太陽的光能將水加熱。", ans: false, explanation: "集熱器主要是利用太陽的「熱能」將水加熱。" },
            { type: "TF", q: "由於臺灣位於北半球，太陽在天空中的運行偏向南方天空，所以安裝太陽能熱水器時，要將集熱器偏向南方，才會發揮較高效能。", ans: true, explanation: "面向南方能最有效率接收太陽直射的熱能。" },
            { type: "TF", q: "剛洗完的溼衣服可以利用太陽的光來晒乾。", ans: false, explanation: "主要是利用太陽的「熱」將水分蒸發晒乾。" },
            { type: "TF", q: "植物的莖不僅可以吸收土壤中的水分和養分，還可以固定植物體。", ans: false, explanation: "吸收水分與固定植物體主要是「根」的功能，莖負責輸送與支撐。" },
            { type: "TF", q: "植物的花一定要具有雄蕊和雌蕊的構造，才能藉由授粉，使雌蕊發育成果實和種子。", ans: false, explanation: "有些植物的花是單性花（只有雄蕊或只有雌蕊），需靠不同花朵授粉。" },
            { type: "TF", q: "藉由陽光下影子的長度能判斷出太陽的方位。", ans: false, explanation: "影子的「長度」用來判斷太陽高度角，影子的「方位」才能判斷太陽方位。" },
            { type: "TF", q: "朱槿和南瓜都是屬於兩性花。", ans: false, explanation: "朱槿是兩性花，但南瓜是單性花。" },
