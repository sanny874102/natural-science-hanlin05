<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級自然科學 線上練習大題庫（翰林版）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-seedling"></i> 五年級自然科學 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：翰林版 五上 第 1、2 單元（100% 完整收錄段考總題庫 + 期中甲乙卷 + 4份單元卷 + 4份學習單）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 220 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg cursor-pointer">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對：0 題（目前得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200 cursor-pointer">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 cursor-pointer">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/natural-science-hanlin05/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0 cursor-pointer">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 完整收錄 11 份試卷與學習單（共 220 題）的題庫與詳解
        const allQuestions = [
            // ================= 一、是非題（整合所有考卷共 95 題） =================
            // 1. 段考總題庫 是非題 (62題完整收錄)
            { type: "TF", q: "進行植物的分類時，無論利用哪一種分類依據，最後的分類結果都一定會相同。", ans: false, explanation: "不一定。依據不同的分類標準（如生長環境、葉脈或開花與否），分類結果會不同。" },
            { type: "TF", q: "自然界的植物五花八門，各有各的樣貌和姿態。", ans: true, explanation: "自然界植物種類繁多，有各自不同的外形特徵與生長方式。" },
            { type: "TF", q: "大萍和布袋蓮都是陸生植物。", ans: false, explanation: "大萍和布袋蓮都是生長在水面上的漂浮性「水生植物」。" },
            { type: "TF", q: "自己製作太陽高度角觀測器時，只要確認吸管是直立的就好，不需要檢查是否與地面垂直。", ans: false, explanation: "吸管必須與地面（底板）保持垂直，測出的太陽高度角才會準確。" },
            { type: "TF", q: "水分從植物的根吸收進入植物體，經由莖輸送到葉子，最後從葉子蒸散出去。", ans: true, explanation: "植物體內水分運輸的方向為：根吸收→莖輸送→葉蒸散。" },
            { type: "TF", q: "太陽光射入三稜鏡後，我們可以看到像彩虹一樣的七彩色光。", ans: true, explanation: "太陽光通過三稜鏡會因折射而分散成紅、橙、黃、綠、藍、靛、紫等彩虹色光。" },
            { type: "TF", q: "雨過天晴時，天上的彩虹會出現在太陽的相反方向。", ans: true, explanation: "陽光照射空氣中的小水滴經折射與反射形成彩虹，彩虹會出現在太陽的相反方向。" },
            { type: "TF", q: "不同季節的日出時刻和日落時刻都不太相同。", ans: true, explanation: "夏至日出最早、日落最晚（白晝最長）；冬至日出最晚、日落最早（白晝最短）。" },
            { type: "TF", q: "在臺灣，夏季的太陽高度角會比冬季的太陽高度角大，因此氣溫也會比較高。", ans: true, explanation: "太陽高度角會影響氣溫變化，夏季太陽高度角大（較直射），氣溫較高。" },
            { type: "TF", q: "一年之中，每天上午 6 時看到太陽升起的位置都相同。", ans: false, explanation: "不同。一年中太陽升起的位置與時間會隨季節改變（例如春分秋分在正東、夏至東偏北、冬至東偏南）。" },
            { type: "TF", q: "同一時間、地點，夏天的太陽高度角會比冬天的大。", ans: true, explanation: "夏天太陽的運行軌跡偏北且較高，故同一時間的太陽高度角比冬天大。" },
            { type: "TF", q: "適當的照射太陽光，可產生身體需要的維生素 C。", ans: false, explanation: "適當照射太陽光可幫助人體合成所需的「維生素 D」，而非維生素 C。" },
            { type: "TF", q: "進行植物分類時，只要有共同特徵的植物就有可能被分在同一類。", ans: true, explanation: "依據分類方式，相同特徵愈多，愈可能被分在同一類。" },
            { type: "TF", q: "金桔的果實是在金桔花授粉成功後，由子房發育而成。", ans: true, explanation: "花朵授粉後，雌蕊的子房會發育成果實，胚珠則發育成種子。" },
            { type: "TF", q: "我們晒太陽的好處之一，是可以合成人體所需的維生素 A。", ans: false, explanation: "晒太陽可以幫助人體合成所需的「維生素 D」，而非維生素 A。" },
            { type: "TF", q: "太陽直射時的氣溫，會比太陽斜射時的氣溫高。", ans: true, explanation: "陽光直射時單位面積接收到的熱能比斜射時多，因此氣溫較高。" },
            { type: "TF", q: "同一種植物可能有多種的繁殖方式。", ans: true, explanation: "例如甘藷可以利用塊根、莖或種子進行繁殖；落地生根可用葉或種子繁殖。" },
            { type: "TF", q: "只要是陣雨過後，在天空中一定可以看到彎彎的彩虹出現。", ans: false, explanation: "不一定。除了空氣中有小水滴外，還必須有陽光照射且觀察角度（背對太陽）配合才看得到。" },
            { type: "TF", q: "太陽能光電板可以將太陽的光轉換成電能使用，例如：太陽能路燈提供照明。", ans: true, explanation: "太陽能光電板能將太陽光能轉換為電能儲存並供路燈照明。" },
            { type: "TF", q: "太陽的方位與影子的方位相反。", ans: true, explanation: "光線沿直線前進，當物體擋住陽光時，會在太陽的相反方向形成影子。" },
            { type: "TF", q: "大花咸豐草的果實有倒勾刺，會鉤附在人的衣物或動物身上來傳播種子。", ans: true, explanation: "大花咸豐草（鬼針草）果實前端有倒鉤刺，可藉由鉤附在動物或人身上傳播。" },
            { type: "TF", q: "一種植物只有一種繁殖方式，例如：甘藷只能利用塊根繁殖。", ans: false, explanation: "一種植物可能有不同的繁殖方式，例如甘藷的根、莖和種子都可以進行繁殖。" },
            { type: "TF", q: "太陽是地球生命能量的來源，可以讓地球上的生物生生不息。", ans: true, explanation: "太陽提供光與熱，讓植物行光合作用並維持地球溫暖，是生命能量的來源。" },
            { type: "TF", q: "進行「植物體內水分輸送」實驗時，在水中滴入紅色的水溶液，是為了可以方便觀察水在植物體內的變化。", ans: true, explanation: "有顏色的水溶液被植物吸收後會將運送部位染紅，較容易被觀察。" },
            { type: "TF", q: "太陽能光電板設置在屋頂上，可以用來遮陽和發電。", ans: true, explanation: "屋頂架設太陽能光電板既能吸收光能發電，也能阻擋陽光直接照射屋頂達到降溫遮陽效果。" },
            { type: "TF", q: "甘藷除了可以利用種子繁殖外，也可以利用莖或根來繁殖。", ans: true, explanation: "甘藷用塊根繁殖時下方長根、上方長新芽；以莖扦插繁殖時，土壤裡的節長根、上方的節長新枝葉。" },
            { type: "TF", q: "一天中，丹丹從太陽升起就開始觀測陽光下電線桿的影子變化，發現桿影會由長慢慢變短，直到太陽落下。", ans: false, explanation: "一天中，上午竿影會由長慢慢變短，但「中午過後會由短慢慢變長」直到太陽落下。" },
            { type: "TF", q: "下午 4 時測量太陽高度角，夏天測得的太陽高度角會比冬天測得的大。", ans: true, explanation: "夏天太陽運行的軌跡偏北，同一時刻的太陽高度角較冬天大。" },
            { type: "TF", q: "一年中，同一時間的太陽高度角以 12 月 22 日前後的最大。", ans: false, explanation: "一年中同一時間的太陽高度角以「6 月 21 日（夏至）前後」最大，12 月 22 日（冬至）前後最小。" },
            { type: "TF", q: "一年中，每天相同時間測量太陽高度角，從 3 月到 6 月，所測得的太陽高度角會愈來愈大。", ans: true, explanation: "從 3 月（春分）到 6 月（夏至）之間，太陽每日運行軌跡逐漸偏北，太陽高度角愈來愈大。" },
            { type: "TF", q: "奶奶用放大鏡來看報紙，是透過光的折射現象，讓字變得更大、更清楚。", ans: true, explanation: "放大鏡（凸透鏡）利用光線穿過空氣與玻璃不同介質時的折射現象，形成正立放大影像。" },
            { type: "TF", q: "大萍的葉片裡具有通氣組織可儲存空氣，讓大萍浮於水面。", ans: true, explanation: "大萍的葉片肥厚且內部有通氣組織儲存空氣，使整株植物能漂浮在水面上。" },
            { type: "TF", q: "所有植物要繁殖下一代，都一定要經過開花、結果和產生種子的過程。", ans: false, explanation: "不一定。例如蕨類植物不開花，靠孢子繁殖；許多植物也可利用根、莖、葉等營養器官繁殖。" },
            { type: "TF", q: "當花完成授粉後，雄蕊的花粉和雌蕊胚珠結合會發育成種子，外側的子房會發育成果實。", ans: true, explanation: "授粉受精後，胚珠發育成種子，子房發育成果實。" },
            { type: "TF", q: "太陽能是不可永續的綠能資源，因此不可過度使用。", ans: false, explanation: "太陽能是取之不盡、可永續利用的綠能資源，適當使用能更節約地球能源。" },
            { type: "TF", q: "文娟要將植物分類，她只能透過資料蒐集來了解植物的特徵。", ans: false, explanation: "除了翻閱圖鑑與上網查資料外，也可以透過「實地觀察」來了解植物的特徵。" },
            { type: "TF", q: "在上午進行製造彩虹的實驗時，要站在太陽下並面向西方噴灑水霧，才有機會製造出彩虹。", ans: true, explanation: "上午太陽在東方，背向陽光（即面向西方）噴灑水霧，才有機會製造出彩虹。" },
            { type: "TF", q: "一天中，文惠觀測陽光下升旗臺上旗竿的影子變化，從中午開始一直到下午放學，發現竿影會愈來愈長。", ans: true, explanation: "中午過後，太陽的高度角會愈來愈低（小），因此竿影會愈來愈長。" },
            { type: "TF", q: "夜晚時，樂樂在漆黑的陽臺上擺放三稜鏡，三稜鏡會分散出像彩虹般的色光。", ans: false, explanation: "三稜鏡本身不會發光，夜晚沒有光線照射，不會出現像彩虹的色光。" },
            { type: "TF", q: "根據「莖是否直立」的分類標準，可以將樟樹和蛇莓分在同一類。", ans: false, explanation: "樟樹是直立的高大木本莖，蛇莓是沿地面生長的匍匐莖，因此會被分在不同類。" },
            { type: "TF", q: "林奈發明的「二名法」是給每一種植物一個拉丁文學名，這個學名是由屬名和種小名所構成的。", ans: true, explanation: "「二名法」是給每一種生物一個拉丁文學名，由屬名（在前）和種小名（在後）構成。" },
            { type: "TF", q: "光線從空氣進入平面的透明玻璃後，不會往中間聚集。", ans: true, explanation: "平面透明玻璃不會像中央凸起的放大鏡（凸透鏡）那樣把光線往中間聚集。" },
            { type: "TF", q: "在夜市撈魚時，魚在水中的實際位置會比眼睛看起來的位置還要淺。", ans: false, explanation: "由於光的折射現象，眼睛看見的魚像較淺，魚在水中的「實際位置會比眼睛看起來的位置還要深」。" },
            { type: "TF", q: "在同一地點觀測日出，會發現日出的位置不會隨著季節而改變。", ans: false, explanation: "日出的位置會隨著季節改變（夏至偏北、春分秋分正東、冬至偏南）。" },
            { type: "TF", q: "植物體內的水，經由葉片以水蒸氣的形態散發到空氣中的過程，稱為散發作用。", ans: false, explanation: "稱為「蒸散作用」，而非散發作用。" },
            { type: "TF", q: "榕樹的氣生根可以儲存養分。", ans: false, explanation: "榕樹的氣生根主要功能是「吸收空氣中的水分」，著地後則變成支柱根支撐植物體。" },
            { type: "TF", q: "在臺灣，太陽在天空中的運行偏向南方天空，所以需要大量日照才能生存的植物，種植時要種在偏南方的地點。", ans: true, explanation: "日照型植物喜歡接受太陽照射，臺灣太陽軌跡偏南，種植在面向南方且無遮蔭處日照最充足。" },
            { type: "TF", q: "榕樹的氣生根如果一直生長到地面，氣生根會迅速加粗生長，演變成具有支撐植物體功能的支柱根。", ans: true, explanation: "隨著榕樹枝葉不斷向外擴展，氣生根著地後會變粗成長為支柱根。" },
            { type: "TF", q: "噴水製造彩虹時，站在陽光處面向著陰影的地方噴水霧，其目的是為了要更清楚的看到彩虹的形成。", ans: true, explanation: "背向陽光並朝陰影處噴水霧，背景較暗，能更清楚觀察到彩虹色光。" },

            // 3. 光的折射與放大鏡實驗題組
            { type: "MC", q: "【雷射光折射路線判斷】進行「雷射筆光線斜射進入水中」與「從水中斜射進入空氣」的實驗時，關於光線偏折路線的敘述，何者正確？", options: ["光從空氣斜射入水中時，折射光線會往下方（較陡、偏向法線）偏折；從水中斜射入空氣時，會往水面方向偏折", "光從空氣斜射入水中時，會直直前進完全不偏折", "光從空氣斜射入水中時，會往上翹起偏折", "雷射光無法穿過水面"], ans: 0, explanation: "光從空氣斜射入水時會向下偏折（偏向垂直線）；從水斜射入空氣時則會往水面側偏折（偏離垂直線）。" },
            { type: "MC", q: "【光的折射實驗條件】老師請同學把筆插進裝水的杯中觀察折射現象，小傑說：「只有從側面看筆才彎掉，從正上方垂直看是直的。」若要讓學弟妹清楚看到筆錯位的折射現象，必須保留哪三個關鍵條件？", options: ["①筆插入水中要斜斜的、②水要清澈且杯子透明、③從側面觀察且光線充足對比明確", "①筆要垂直插入、②使用不透明紙杯、③從正上方觀察", "①杯子裡不裝水、②在全黑房間觀察、③筆放杯子外", "以上皆非"], ans: 0, explanation: "光線斜向通過不同介質才會有明顯折射錯位，且杯子須透明、從側面觀察並有良好光線對比。" },
            { type: "MC", q: "【放大鏡成像實驗】小芸用放大鏡在距離紙張「很近」的地方觀察圖案，看到正立放大的影像；但弟弟把放大鏡拿得「距離圖案很遠」，卻發現圖案變成「上下顛倒且縮小」了！這是為什麼？", options: ["這是正常的光學折射現象，當物體距離放大鏡（凸透鏡）太遠（超過焦距）時，就會形成倒立的影像，只要把放大鏡拿近就能看到正立放大圖案", "因為弟弟把放大鏡弄壞了", "因為白紙自己會把圖案倒過來反射", "因為放大鏡只能在晚上使用"], ans: 0, explanation: "凸透鏡（放大鏡）在近距離（焦距內）觀察時會產生正立放大的虛像；距離太遠時則會因為光線匯聚交叉而呈現倒立影像。" },
            { type: "MC", q: "【好玩的折射學習單】恬恬想分辨生活中哪些現象屬於「光的折射現象」，請問下列哪一組全部都是光的折射現象？", options: ["①腳在水中看起來變短了、④撈魚時在看起來是魚的位置卻撈不到魚、⑤插入水中的吸管好像斷了、⑥用放大鏡看到放大的影像", "②從鏡子中看到自己、③站在陽光下看到自己的影子", "①腳在水中變短、②照鏡子看到自己", "③陽光下的影子、⑤水中吸管斷掉"], ans: 0, explanation: "照鏡子是「光的反射」，陽光下的影子是「光直線前進被阻擋」；水中腳變短、撈魚錯位、吸管折斷與放大鏡皆為「光的折射」。" },

            // 4. 植物的分類（二分法）與環境適應配合題
            { type: "MC", q: "【植物適應環境構造配對】①玉山杜鵑的革質（蠟質）葉面、②榕樹垂下的氣生根、③布袋蓮膨大的葉柄、④鳳凰木與木麻黃的板根、⑤海茄苳的呼吸根。以上特殊構造的功能配對，何者完全正確？", options: ["①減少水分蒸散、②吸收空氣中水分、③儲存空氣漂浮水面、④固定植物體抵抗強風、⑤在缺氧泥土中獲取氧氣", "①吸收水分、②漂浮水面、③固定植物、④減少蒸散、⑤儲存養分", "①行呼吸作用、②儲存水分、③抵抗強風、④漂浮水面、⑤吸引昆蟲", "以上皆非"], ans: 0, explanation: "植物會演化出不同構造適應環境：蠟質葉防蒸散、氣生根吸水與支撐、膨大葉柄助漂浮、板根固持抗風、呼吸根助缺氧泥灘呼吸。" },
            { type: "MC", q: "【水生植物二分法】將「大萍、布袋蓮、睡蓮、荷花（蓮）」四種水生植物，以「是不是漂浮性植物（根是否漂浮在水中不著土）」進行二分法分類，結果為何？", options: ["是漂浮性植物：大萍、布袋蓮；不是漂浮性植物：睡蓮（浮葉性）、荷花（挺水性）", "是漂浮性植物：睡蓮、荷花；不是漂浮性植物：大萍、布袋蓮", "是漂浮性植物：大萍、睡蓮；不是漂浮性植物：布袋蓮、荷花", "四種全部都是漂浮性植物"], ans: 0, explanation: "大萍與布袋蓮整株漂浮水面；睡蓮（浮葉性）與荷花（挺水性）的根都固定在水底泥土裡。" },
            { type: "MC", q: "【四種植物三階二分法】將「A大萍、B蛇莓、C樟樹、D布袋蓮」進行分類：第一階「①生長在水中 vs ②不是生長在水中」；水中組再依「③葉面有細毛 vs ④葉面光滑無細毛」分開；陸生組再依「⑤有匍匐莖 vs ⑥沒有匍匐莖（木本莖）」分開。請問③、④、⑤、⑥依序是哪一種植物？", options: ["③大萍(A)、④布袋蓮(D)、⑤蛇莓(B)、⑥樟樹(C)", "③布袋蓮(D)、④大萍(A)、⑤樟樹(C)、⑥蛇莓(B)", "③大萍(A)、④蛇莓(B)、⑤布袋蓮(D)、⑥樟樹(C)", "③樟樹(C)、④布袋蓮(D)、⑤大萍(A)、⑥蛇莓(B)"], ans: 0, explanation: "水生植物中，大萍葉面有細毛(A)、布袋蓮葉面光滑(D)；陸生植物中，蛇莓有匍匐莖(B)、樟樹為高大直立木本莖(C)。" },
            { type: "MC", q: "【宜庭的植物分類表推理】宜庭將 A~F 六種植物分類：先依「會不會開花」分成「不開花(A)」與「開花(B~F)」；開花植物再依「水生或陸生」分成「水生(D、F)」與「陸生(B、C、E)」；陸生再依「平行脈或網狀脈」分成「平行脈(B)」與「網狀脈(C、E)」。請問下列推論何者正確？", options: ["A 可能是利用孢子繁殖的蕨類；D、F 是水生植物所以無法從此表辨別是不是平行脈；C 和 E 分在最後同一組故外形特徵最相近", "A 是開花植物", "B 是水生植物", "A 和 B 生長環境最相似"], ans: 0, explanation: "A 不開花可能為蕨類（靠孢子繁殖）；平行脈分類標準只用在 B、C、E，故 A、D、F 無法從表中辨別葉脈；同組的 C、E 特徵最相近。" },
            { type: "MC", q: "【植物幫助繁殖判斷】下列四個情境中，哪些現象真的可以幫助植物傳播種子或授粉繁殖？①蒲公英果實被風吹散、②登山者把沾在褲子上的大花咸豐草果實拔下丟在山坡、③觀光客買被鑿洞喝光椰子水的椰子殼丟棄、④蝴蝶在花朵上採花蜜。", options: ["①、②、④ 可以幫助繁殖（③已被鑿洞破壞無法發芽）", "①、②、③、④ 全部都可以", "只有 ①、④ 可以", "只有 ②、③ 可以"], ans: 0, explanation: "椰子雖然靠水力傳播，但被鑿洞喝掉椰子水的椰子內部胚與養分已受損，無法再發芽繁殖。" },
            { type: "MC", q: "【陽光過量與植物生長】小佑問：「為什麼植物晒太陽太久反而會枯萎？不是陽光對植物有幫助嗎？」下列哪一個回應最科學、最正確？", options: ["植物雖然需要適量陽光進行光合作用，但如果曝晒時間過長、強度過高，會讓植物蒸散失水過快且溫度過高，反而不利生長甚至枯萎", "因為太陽會釋放毒素把植物毒死", "因為植物其實完全不需要陽光，只需要水", "因為植物在白天只會行呼吸作用"], ans: 0, explanation: "適量陽光有助於光合作用，但過度曝晒會導致水分蒸散速率大於根部吸水速率，造成植物缺水枯萎。" },

            // 5. 閱讀測驗題組（完整收錄 9 大篇閱讀素養題）
            { type: "MC", q: "【閱讀測驗：奇幻王國果實】阿凱記錄了四種植物果實特徵：「花瓜果（鮮豔多汁香甜）」、「紅棉仔（成熟後迸裂彈射）」、「仙奇果（果實中空可浮於水面）」、「西桃樹（果實內有絨毛輕飄飄）」。請問水力、動物、風力、自身彈力依序對應哪一種植物？", options: ["水力：仙奇果；動物：花瓜果；風力：西桃樹；自身彈力：紅棉仔", "水力：花瓜果；動物：仙奇果；風力：紅棉仔；自身彈力：西桃樹", "水力：西桃樹；動物：紅棉仔；風力：仙奇果；自身彈力：花瓜果", "以上皆非"], ans: 0, explanation: "中空浮水靠水力（仙奇果）；鮮豔香甜吸引動物（花瓜果）；絨毛輕飄靠風力（西桃樹）；成熟迸裂靠自身彈力（紅棉仔）。" },
            { type: "MC", q: "【閱讀測驗：元旦迎接曙光】根據元旦全臺迎接曙光時刻表（臺北06:39、臺中06:40、嘉義06:40、臺東06:36、花蓮06:37），請問哪一個地方最早迎接曙光？且若嘉義上午 10 時太陽高度角為 53 度，上午 9 時可能是幾度？", options: ["臺東最早迎接曙光（06:36）；嘉義上午 9 時高度角較低，可能為 41 度", "桃園最早迎接曙光；嘉義上午 9 時可能為 65 度", "花蓮最早迎接曙光；嘉義上午 9 時可能為 70 度", "臺北最早迎接曙光；嘉義上午 9 時可能為 55 度"], ans: 0, explanation: "06:36 比其他時間都早，故「臺東」最早看到日出；中午前太陽高度角隨時間上升，故 9 時高度角必小於 10 時的 53 度（選 41 度）。" },
            { type: "MC", q: "【閱讀測驗：太陽能優缺點】太陽能是最豐富、乾淨且比核能安全的能源，但裝置必須占據相當大的面積、造價較高，且容易受氣候與晝夜影響。請問下列結論何者「錯誤」？", options: ["太陽能設備目前造價非常便宜且不占空間", "太陽能是比較環保的能源", "陰雨氣候與夜晚會影響太陽能發電效能", "太陽能計算機、太陽能熱水器與太陽能公車都是太陽能的應用"], ans: 0, explanation: "根據文章，目前太陽能裝置必須占據相當大面積且造價較高，因此「目前非常便宜」是錯誤的結論。" },
            { type: "MC", q: "【閱讀測驗：沙漠海市蜃樓】柏油路面和沙漠中常發生「海市蜃樓」，是因為愈靠近地面的空氣愈熱，不同溫度的空氣有不同的折射率（溫度愈高折射率愈低），陽光經過不同溫度空氣層時產生偏折，把遠處景物投射在眼前。這主要與光的什麼現象有關？", options: ["光在不同溫度的空氣介質中折射率不同，產生「折射現象」", "光只能直線前進完全不會偏折", "沙漠裡的沙子像鏡子一樣把太陽吞掉", "純粹是人類飢渴產生的心理幻覺，與光無關"], ans: 0, explanation: "沙漠高溫造成空氣冷熱分層，光進入不同溫度介質時產生「折射」，形成海市蜃樓的光學現象。" },
            { type: "MC", q: "【閱讀測驗：彩虹與月虹】彩虹不只七種顏色，顏色間還有漸層色；且太陽在觀察者背後以「低角度」照射時才能看到彩虹（若太陽在頭頂，彩虹在地平線下看不到）。在月光強烈的夜晚則可能出現罕見的「月虹（晚虹）」，因夜間光線低，人眼難以分辨顏色而看起來像白色。根據文章，下列何者正確？", options: ["彩虹不只有七彩顏色；陽光、水滴與照射角度都會影響能否看到彩虹；月虹會出現在月光強烈的夜晚", "月虹本身真的只有白色，沒有其他色光", "面向陽光且太陽在正頭頂高角度時最容易看到彩虹", "日出或中午時會出現月虹"], ans: 0, explanation: "月虹其實也有多種顏色，只是人眼在低光線下無法辨識；且觀察彩虹必須背向太陽、低角度照射。" },
            { type: "MC", q: "【閱讀測驗：植物多元繁殖】石蓮、落地生根可以葉繁殖；草莓、蛇莓、馬鈴薯可以莖繁殖；甘藷、薑、蘿蔔可以根繁殖。請問「落地生根」的新芽會從哪個部位長出？且關於甘藷何者「錯誤」？", options: ["落地生根從「葉緣缺刻處」長出新芽；說「甘藷只有一種繁殖方式」是錯誤的（甘藷可用根、莖、種子繁殖）", "落地生根從葉柄長出新芽；甘藷只能用葉繁殖", "落地生根從花朵長出新芽；甘藷塊根不能儲水", "以上皆非"], ans: 0, explanation: "落地生根會從肥厚葉片的「葉緣」缺刻處長出新芽與不定根；甘藷則具有塊根、莖與種子等多種繁殖方式。" },
            { type: "MC", q: "【閱讀測驗：虹與霓的奧祕】「虹」是陽光在小水滴中經過「兩次折射、一次反射」產生，外紅內紫；而「霓」（副虹）則是陽光從水滴下方射入，經過「兩次折射、兩次反射」產生，因為多了一次反射，能量減弱所以顏色較淡，且顏色排列與虹相反（外紫內紅）。請問下列何者錯誤？", options: ["虹和霓都要「面向陽光」才能看見", "形成霓時，陽光在小水滴裡發生兩次折射、兩次反射", "陽光射入小水滴的位置不同，導致虹與霓的差異", "虹和霓的七種色光排列順序剛好相反"], ans: 0, explanation: "無論是觀察「虹」還是「霓」，都必須「背向陽光」才能看見，面向陽光是錯誤的。" },
            { type: "MC", q: "【閱讀測驗：日本山荷葉（透明花）】日本山荷葉原本開白花，但淋雨沾水後花瓣會變得幾乎透明！因為花瓣表面布滿微小空隙，當水填滿空隙時，光線不再被反射而是直接穿透並發生「折射現象」。請問下列哪一個日常應用與「透明花」的光學原理最類似？", options: ["利用放大鏡把陽光折射集中成一個小光點（或水中的吸管看起來折斷）", "用黑布遮光讓房間變暗", "在陽光下看見自己的影子", "照鏡子看見自己的臉"], ans: 0, explanation: "透明花與「放大鏡聚光」都是利用光在不同介質間改變行進方向的「折射原理」（照鏡子是反射，黑布遮光與影子是光直線前進）。" },
            { type: "MC", q: "【閱讀測驗：紅樹林水筆仔胎生苗】水筆仔生活在海邊潮溼、鹽分高、土壤鬆軟且含氧量低的紅樹林泥灘，種子掉在地面難以發芽。因此水筆仔演化出「胎生現象」：種子先在母樹果實上發芽長成筆狀的「胎生苗」，累積足夠養分後才掉落插進泥中，或利用胎生苗內的空氣漂浮隨海水傳播到遠方。請問下列敘述何者正確？", options: ["胎生苗在母株上先發芽長大並累積養分，是為了適應泥濘缺氧、不利種子發芽的紅樹林環境；內部含空氣則能幫助胎生苗藉由水力漂浮傳播", "胎生苗留在母樹上是為了吸引鳥類把幼苗吃掉", "胎生苗內部含空氣是為了減少葉面蒸散作用", "水筆仔生長在乾燥缺水的高山環境"], ans: 0, explanation: "水筆仔為了克服紅樹林泥土鬆軟缺氧、高鹽分的惡劣發芽環境，讓種子先在母樹上發育成強壯的胎生苗再掉落插泥或隨水漂流傳播。" }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let selectedOption = null;

        function startQuiz() {
            const countValue = document.getElementById('question-count').value;
            let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);

            if (countValue === "all") {
                currentQuizQuestions = shuffled;
            } else {
                const limit = parseInt(countValue);
                currentQuizQuestions = shuffled.slice(0, limit);
            }

            currentIndex = 0;
            correctCount = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            loadQuestion();
        }

        function getCurrentScore() {
            return Math.round((correctCount / currentQuizQuestions.length) * 100);
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `題目 ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;

            const container = document.getElementById('question-container');
            
            if (qData.type === "TF") {
                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （是非題）${qData.q}</h3>
                    <div class="space-y-3">
                        <button onclick="checkAnswer(true, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3 cursor-pointer">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">○</span> 正確 (O)
                        </button>
                        <button onclick="checkAnswer(false, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3 cursor-pointer">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">×</span> 錯誤 (X)
                        </button>
                    </div>
                `;
            } else {
                let optionsHtml = '';
                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3 cursor-pointer">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">${idx + 1}</span> <span>${opt}</span>
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                correctCount++;
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${getCurrentScore()} 分`;
                document.getElementById('final-detail').innerText = `共挑戰 ${currentQuizQuestions.length} 題，答對 ${correctCount} 題`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>
</body>
